<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bordereaux CNAS / CASNOS</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#1b2733;--mu:#5b6573;--bd:#d9dfe7;--pr:#1f4e78;--pt:#fff;--ok:#1b7f4b;--wa:#a86400;--ba:#b3261e;--hd:#eaf2f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1720;--cd:#18222e;--tx:#e6edf5;--mu:#9aa8b8;--bd:#2c3a4a;--pr:#5b9bd5;--pt:#0f1720;--ok:#4cc38a;--wa:#e0a84a;--ba:#ff8a80;--hd:#1f2d3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,'Segoe UI',Arial,sans-serif}
header{background:var(--pr);color:var(--pt);padding:14px 16px}

nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--cd);border-bottom:1px solid var(--bd)}

main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}

input,select{font:inherit;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}

button.p{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}
.bt{display:flex;gap:8px;align-items:end}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.tb h2{margin:0;flex:1}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{background:var(--hd);color:var(--pr);text-align:left;font-size:12px;padding:7px 8px;white-space:nowrap}

.k div{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:17px}
.ok{color:var(--ok)}.wa{color:var(--wa)}.ba{color:var(--ba)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--hd);color:var(--pr)}
#bar{position:sticky;top:0;z-index:5}#bar div{background:var(--pr);color:var(--pt);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar span{flex:1}.em{color:var(--mu);text-align:center;padding:18px}
#ph{display:none}
@media print{:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--cd:#fff;--tx:#000;--pr:#000;--pt:#000;--hd:#eee;--bd:#999;--mu:#444}header p,nav,#bar,form,.np,.ac,.tb select,.tb input,.tb button{display:none!important}header{background:none;padding:0}header h1{font-size:16px}#ph{display:block;font-weight:700;margin:6px 12px}.card{border:0;padding:0}.k div{border:1px solid #999}table{min-width:0;font-size:11px}.w{overflow:visible}}
</style></head><body>
<header><h1>Gestion des bordereaux CNAS / CASNOS</h1><p>Dépôts · paiements · rejets · réintégrations · recherche d’ordonnances rejetées — montants en DA</p></header>
<nav id="nav"></nav><div id="bar"></div><div id="ph"></div><main id="v"></main>
<main class="np"><div class="card"><div class="tb"><h2>Sauvegarde</h2><button id="ex">Exporter (JSON)</button><button id="im">Importer (JSON)</button><button id="ix">Importer depuis Excel</button><input id="fi" type="file" accept=".json" hidden><input id="fx" type="file" accept=".xlsx,.xlsm" hidden></div>
<small style="color:var(--mu)">Les données restent dans ce navigateur, sur cet appareil uniquement. Exportez régulièrement une copie de sauvegarde.</small></div></main>
<script>
const ORG=['CNAS','CASNOS'],KEY='bordereaux_cnas_casnos_v1';
const MOT=['Erreur de prescription','Droit non ouvert','Pièce manquante','Erreur d’identification','Non-conformité administrative','Dépassement / quantité','Autre'];
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v)||0,money=v=>num(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),fd=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date().toISOString().slice(0,10),nz=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let db={dep:[],pay:[],rej:[],rei:[]},E={},DL=null,tab='dash';
try{const t=localStorage.getItem(KEY);if(t)db=Object.assign(db,JSON.parse(t))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){say('Enregistrement local impossible dans cette vue : exportez vos données.')}}
if(window.claude&&claude.use)claude.use('downloads').then(x=>DL=x).catch(()=>{});
function say(m,btns){$('#bar').innerHTML=m?`<div><span>${esc(m)}</span>${(btns||[]).map((b,i)=>`<button data-b="${i}">${b[0]}</button>`).join('')}<button data-b="x">Fermer</button></div>`:'';
 $('#bar').onclick=e=>{const b=e.target.dataset.b;if(b==null)return;$('#bar').innerHTML='';if(b!=='x')btns[b][1]()}}
const gl=r=>num(r.total)+num(r.mfae)+num(r.maj);
const paid=d=>db.pay.filter(p=>p.org===d.org&&String(p.dnum)===String(d.num)&&p.statut!=='Annulé').reduce((s,p)=>s+gl(p),0);
const reint=id=>db.rei.filter(x=>x.rid===id).reduce((s,x)=>s+num(x.montant),0);
const rejOf=id=>db.rej.find(r=>r.id===id);
function sync(id){const r=rejOf(id);if(!r)return;const t=reint(id);
 if(t>0&&t>=num(r.montant))r.statut='Réintégré';else if(t>0)r.statut='En cours de régularisation';else if(r.statut==='Réintégré')r.statut='Rejeté'}
const st=s=>{const c={'Rejeté':'ba','Réintégré':'ok','Payé':'ok','Reçu':'ok','Régularisé':'ok','Annulé':'mu'}[s]||'wa';return`<span class="tag ${c}">${esc(s)}</span>`};
const alertH=t=>t?`<span class="ba">⚠ ${t}</span>`:'<span class="ok">OK</span>';
const CFG={
dep:{t:'Dépôts',s:'un dépôt',key:'num',kl:'N° bordereau',f:[['org','Organisme','sel',ORG],['date','Date du dépôt','date'],['num','N° bordereau','txt'],['nb','Nombre de factures','int'],['total','Montant total (DA)','num'],['mfae','MFAE (DA)','num'],['maj','Majorations (DA)','num'],['statut','Statut','sel',['Déposé','Payé','Partiellement payé','Rejeté','Régularisé']],['obs','Observations','txt']],
 cols:[['Date',r=>fd(r.date)],['Organisme',r=>r.org],['N°',r=>esc(r.num)],['Global (DA)',r=>money(gl(r)),'r'],['Payé (DA)',r=>money(paid(r)),'r'],['Reste (DA)',r=>{const x=gl(r)-paid(r);return`<span class="${x>0.005?'wa':x<-0.005?'ba':'ok'}">${money(x)}</span>`},'r'],['Statut',r=>st(r.statut)],['Contrôle',r=>alertH(db.dep.filter(x=>x.org===r.org&&x.num===r.num).length>1?'Doublon':'')]]},
pay:{t:'Paiements',s:'un paiement',key:'num',kl:'N° bordereau paiement',f:[['org','Organisme','sel',ORG],['date','Date du paiement','date'],['num','N° bordereau paiement','txt'],['dnum','N° bordereau dépôt associé','txt'],['total','Montant total (DA)','num'],['mfae','MFAE (DA)','num'],['maj','Majorations (DA)','num'],['statut','Statut','sel',['Reçu','Partiel','À vérifier','Annulé']],['obs','Observations','txt']],
 cols:[['Date',r=>fd(r.date)],['Organisme',r=>r.org],['N° paiement',r=>esc(r.num)],['Dépôt associé',r=>esc(r.dnum)],['Global (DA)',r=>money(gl(r)),'r'],['Statut',r=>st(r.statut)],['Contrôle',r=>alertH(db.dep.some(d=>d.org===r.org&&String(d.num)===String(r.dnum))?'':'Dépôt introuvable')]]},
rej:{t:'Rejets d’ordonnances',s:'un rejet',key:'nom',kl:'Nom de l’assuré',f:[['org','Organisme','sel',ORG],['date','Date du rejet','date'],['nom','Nom assuré / conjoint','txt'],['ass','N° assurance','txt'],['bnum','N° bordereau','txt'],['montant','Montant ordonnance (DA)','num'],['motif','Motif du rejet','sel',MOT],['statut','Statut','sel',['Rejeté','En cours de régularisation','Régularisé','Réintégré']],['dreg','Date de régularisation','date0'],['obs','Observations','txt']],
 cols:[['Date',r=>fd(r.date)],['Organisme',r=>r.org],['Assuré',r=>esc(r.nom)],['N° assurance',r=>esc(r.ass)],['Bordereau',r=>esc(r.bnum)],['Montant (DA)',r=>money(r.montant),'r'],['Motif',r=>esc(r.motif)],['Réintégré (DA)',r=>money(reint(r.id)),'r'],['Statut',r=>st(r.statut)]]},
rei:{t:'Réintégrations',s:'une réintégration',key:'rid',kl:'Rejet concerné',f:[['rid','Rejet concerné','selr'],['date','Date de réintégration','date'],['montant','Montant réintégré (DA)','num'],['just','Référence justificatif','txt'],['par','Validé par','txt'],['obs','Observations','txt']],
 cols:[['Date',r=>fd(r.date)],['Organisme',r=>(rejOf(r.rid)||{}).org||'—'],['Assuré',r=>esc((rejOf(r.rid)||{}).nom||'Rejet supprimé')],['Montant (DA)',r=>money(r.montant),'r'],['Justificatif',r=>esc(r.just)],['Validé par',r=>esc(r.par)]]}};
const TABS=[['dash','Tableau de bord'],['dep','Dépôts'],['pay','Paiements'],['rej','Rejets'],['rei','Réintégrations'],['rel','Rejets à relancer'],['rech','Recherche rejets']];
function go(t){tab=t;$('#nav').innerHTML=TABS.map(x=>`<button data-t="${x[0]}" class="${x[0]===t?'on':''}">${x[1]}</button>`).join('');
 $('#ph').textContent=TABS.find(x=>x[0]===t)[1]+' — imprimé le '+fd(today());t==='dash'?dash():t==='rech'?rech():t==='rel'?relance():sec(t)}
$('#nav').onclick=e=>{if(e.target.dataset.t){E={};go(e.target.dataset.t)}};
function fieldH(f,v){const[n,l,t,o]=f;let h;
 if(t==='sel'||t==='selr'){const op=t==='sel'?o.map(x=>[x,x]):db.rej.map(r=>[r.id,`${r.nom} — ${r.org} — ${money(r.montant)} DA (${fd(r.date)})`]);
  h=`<select name="${n}">${t==='selr'?'<option value="">— choisir —</option>':''}${op.map(x=>`<option value="${esc(x[0])}"${x[0]===v?' selected':''}>${esc(x[1])}</option>`).join('')}</select>`}
 else h=`<input name="${n}" type="${t==='date'||t==='date0'?'date':t==='num'||t==='int'?'number':'text'}"${t==='num'?' step="0.01"':''}${t==='num'||t==='int'?' min="0"':''} value="${esc(v)}">`;
 return`<label>${l}${h}</label>`}
function sec(k){const c=CFG[k],ed=db[k].find(r=>r.id===E[k]),d=ed||{org:'CNAS',date:today()};
 $('#v').innerHTML=`<div class="card np"><h2>${ed?'Modifier':'Nouveau'} ${c.s}</h2><form id="f" class="g">${c.f.map(f=>fieldH(f,d[f[0]]==null?(f[2]==='num'||f[2]==='int'?'':''):d[f[0]])).join('')}<div class="bt"><button class="p">Enregistrer</button>${ed?'<button type="button" id="cx">Annuler</button>':''}</div></form></div>
 <div class="card"><div class="tb"><h2>${c.t} (<span id="n"></span>)</h2><select id="fo"><option value="">Tous organismes</option>${ORG.map(o=>`<option>${o}</option>`).join('')}</select><input id="fq" placeholder="Filtrer…"><button type="button" id="pr">Imprimer</button></div><div class="w"><table id="t"></table></div></div>`;
 const f=$('#f');if(k==='rei'&&!db.rej.length)say('Enregistrez d’abord un rejet d’ordonnance pour pouvoir saisir une réintégration.');
 f.onsubmit=e=>{e.preventDefault();const o={};let bad='';
  c.f.forEach(([n,l,t])=>{let v=f.elements[n].value.trim();if(t==='num'||t==='int'){if(v!==''&&(isNaN(v)||+v<0))bad=l+' invalide';v=v===''?0:+v}o[n]=v});
  if(!o.date)bad='La date est obligatoire.';else if(!o[c.key])bad=c.kl+' obligatoire.';
  if(bad)return say(bad);
  if(k==='dep'&&db.dep.some(x=>x.org===o.org&&x.num===o.num&&x.id!==(ed||{}).id)&&!window._dup){window._dup=1;return say('Ce numéro de bordereau existe déjà pour cet organisme. Enregistrer quand même ?',[['Oui',()=>f.requestSubmit()]])}
  window._dup=0;let prev=ed&&ed.rid;if(ed)Object.assign(ed,o);else db[k].push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)},o));
  if(k==='rei'){sync(o.rid);if(prev&&prev!==o.rid)sync(prev)}save();E={};say('Enregistré.');sec(k)};
 const cx=$('#cx');if(cx)cx.onclick=()=>{E={};sec(k)};
 const draw=()=>{const q=nz($('#fq').value),o=$('#fo').value,rows=db[k].filter(r=>(!o||(r.org||(rejOf(r.rid)||{}).org)===o)&&(!q||nz(JSON.stringify(r)+(k==='rei'?(rejOf(r.rid)||{}).nom:'')).includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  $('#n').textContent=rows.length;
  $('#t').innerHTML=`<tr>${c.cols.map(x=>`<th class="${x[2]||''}">${x[0]}</th>`).join('')}<th class="ac"></th></tr>`+(rows.map(r=>`<tr>${c.cols.map(x=>`<td class="${x[2]||''}">${x[1](r)}</td>`).join('')}<td class="ac"><button data-e="${r.id}">Modifier</button><button data-d="${r.id}">Supprimer</button></td></tr>`).join('')||`<tr><td class="em" colspan="${c.cols.length+1}">Aucun enregistrement.</td></tr>`)};
 draw();$('#fq').oninput=$('#fo').onchange=draw;$('#pr').onclick=prt;
 $('#t').onclick=e=>{const b=e.target.dataset;if(b.e){E[k]=b.e;sec(k);scrollTo(0,0)}
  if(b.d)say('Supprimer cet enregistrement ?',[['Supprimer',()=>{const r=db[k].find(x=>x.id===b.d);db[k]=db[k].filter(x=>x.id!==b.d);if(k==='rei')sync(r.rid);save();sec(k)}]])}}
function dash(){const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0),act=db.pay.filter(p=>p.statut!=='Annulé');
 const rows=ORG.map(o=>{const d=sum(db.dep.filter(x=>x.org===o),gl),p=sum(act.filter(x=>x.org===o),gl);return[o,d,p,d-p,d?p/d*100:0]});
 const D=rows.reduce((s,r)=>s+r[1],0),P=rows.reduce((s,r)=>s+r[2],0);
 const att=db.rej.filter(r=>r.statut==='Rejeté'||r.statut==='En cours de régularisation'),rest=sum(db.rej,r=>Math.max(0,num(r.montant)-reint(r.id)));
 const an=db.dep.filter(r=>db.dep.filter(x=>x.org===r.org&&x.num===r.num).length>1).length+db.pay.filter(r=>!db.dep.some(d=>d.org===r.org&&String(d.num)===String(r.dnum))).length;
 const K=(l,v,c)=>`<div><small>${l}</small><b class="${c||''}">${v}</b></div>`;
 $('#v').innerHTML=`<div class="k">${K('Total déposé (DA)',money(D))}${K('Total payé (DA)',money(P))}${K('Reste à encaisser (DA)',money(D-P),D-P>0.005?'wa':'ok')}${K('Taux de recouvrement',(D?P/D*100:0).toFixed(1)+' %')}${K('Ordonnances en attente',att.length,att.length?'ba':'ok')}${K('Reste à réintégrer (DA)',money(rest),rest>0?'wa':'ok')}${K('Total réintégré (DA)',money(sum(db.rei,x=>num(x.montant))),'ok')}${K('Anomalies de saisie',an,an?'ba':'ok')}</div>
 <div class="card"><h2>Par organisme</h2><div class="w"><table><tr><th>Organisme</th><th class="r">Déposé (DA)</th><th class="r">Payé (DA)</th><th class="r">Reste (DA)</th><th class="r">Taux</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r">${money(r[1])}</td><td class="r">${money(r[2])}</td><td class="r">${money(r[3])}</td><td class="r">${r[4].toFixed(1)} %</td></tr>`).join('')}</table></div></div>
 ${db.dep.length+db.rej.length?'':'<div class="card em">Aucune donnée pour le moment : commencez par enregistrer un dépôt dans l’onglet « Dépôts ».</div>'}
 <div class="card"><small style="color:var(--mu)">Montant global = montant total + MFAE + majorations. Les paiements au statut « Annulé » sont exclus. Les écarts sont à valider avec les pièces officielles : ils ne prouvent pas à eux seuls un rejet.</small></div>`}
function rech(){const F=[['nom','Nom de l’assuré','text'],['ass','N° assurance','text'],['bnum','N° bordereau','text'],['org','Organisme','sel',['',...ORG]],['statut','Statut','sel',['','Rejeté','En cours de régularisation','Régularisé','Réintégré']],['motif','Motif','sel',['',...MOT]],['du','Date du rejet : du','date'],['au','au','date']];
 $('#v').innerHTML=`<div class="card np"><h2>Recherche d’ordonnances rejetées</h2><form id="rf" class="g">${F.map(([n,l,t,o])=>`<label>${l}${o?`<select name="${n}">${o.map(x=>`<option value="${esc(x)}">${x||'Tous'}</option>`).join('')}</select>`:`<input name="${n}" type="${t}">`}</label>`).join('')}<div class="bt"><button type="reset" id="rz">Effacer</button><button type="button" id="rx">Exporter (CSV)</button><button type="button" id="rp">Imprimer</button></div></form></div><div class="card"><div class="tb"><h2 id="rs">Résultats</h2></div><div class="w"><table id="rt"></table></div></div>`;
 let res=[];const f=$('#rf'),v=n=>f.elements[n].value.trim();
 const run=()=>{res=db.rej.filter(r=>(!v('nom')||nz(r.nom).includes(nz(v('nom'))))&&(!v('ass')||nz(r.ass).includes(nz(v('ass'))))&&(!v('bnum')||nz(r.bnum).includes(nz(v('bnum'))))&&(!v('org')||r.org===v('org'))&&(!v('statut')||r.statut===v('statut'))&&(!v('motif')||r.motif===v('motif'))&&(!v('du')||r.date>=v('du'))&&(!v('au')||r.date<=v('au'))).sort((a,b)=>b.date.localeCompare(a.date));
  const m=res.reduce((s,r)=>s+num(r.montant),0),ri=res.reduce((s,r)=>s+reint(r.id),0);
  $('#rs').innerHTML=`${res.length} ordonnance(s) — rejeté : ${money(m)} DA · réintégré : ${money(ri)} DA · reste : ${money(Math.max(0,m-ri))} DA`;
  $('#rt').innerHTML='<tr><th>Date</th><th>Org.</th><th>Assuré</th><th>N° assurance</th><th>Bordereau</th><th class="r">Montant (DA)</th><th>Motif</th><th>Statut</th><th class="r">Reste (DA)</th><th class="ac"></th></tr>'+(res.map(r=>`<tr><td>${fd(r.date)}</td><td>${r.org}</td><td>${esc(r.nom)}</td><td>${esc(r.ass)}</td><td>${esc(r.bnum)}</td><td class="r">${money(r.montant)}</td><td>${esc(r.motif)}</td><td>${st(r.statut)}</td><td class="r">${money(Math.max(0,num(r.montant)-reint(r.id)))}</td><td class="ac"><button data-e="${r.id}">Ouvrir</button></td></tr>`).join('')||'<tr><td class="em" colspan="10">Aucune ordonnance ne correspond.</td></tr>')};
 run();f.oninput=f.onchange=run;f.onreset=()=>setTimeout(run);$('#rp').onclick=prt;
 $('#rt').onclick=e=>{if(e.target.dataset.e){E.rej=e.target.dataset.e;go('rej');scrollTo(0,0)}};
 $('#rx').onclick=()=>{const h=['Date','Organisme','Assuré','N° assurance','Bordereau','Montant','Motif','Statut','Réintégré','Reste'];
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  out('rejets_ordonnances.csv','\ufeff'+[h.map(q).join(';')].concat(res.map(r=>[fd(r.date),r.org,r.nom,r.ass,r.bnum,num(r.montant),r.motif,r.statut,reint(r.id),Math.max(0,num(r.montant)-reint(r.id))].map(q).join(';'))).join('\r\n'))}}
const prt=()=>{if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())return say('Impression non disponible dans l’application : utilisez « Exporter (CSV) » puis imprimez depuis un tableur.');try{window.print()}catch(e){say('Impression indisponible ici : utilisez l’export CSV ou ouvrez la page dans un onglet dédié.')}};
const csvq=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
function relance(){const age=r=>Math.max(0,Math.floor((Date.now()-new Date(r.date+'T00:00:00'))/864e5)),rst=r=>Math.max(0,num(r.montant)-reint(r.id));
 const B=[['0 à 30 jours',0,30],['31 à 60 jours',31,60],['61 à 90 jours',61,90],['Plus de 90 jours',91,1e9]];
 $('#v').innerHTML=`<div class="card np"><h2>Rejets à relancer</h2><form id="lf" class="g"><label>Organisme<select name="o"><option value="">Tous</option>${ORG.map(o=>`<option>${o}</option>`).join('')}</select></label><label>Ancienneté minimale (jours)<input name="m" type="number" min="0" value="0"></label><div class="bt"><button type="button" id="lp">Imprimer</button><button type="button" id="lx">Exporter (CSV)</button></div></form></div><div class="k" id="lk"></div><div class="card"><div class="tb"><h2 id="ls"></h2></div><div class="w"><table id="lt"></table></div></div>`;
 const f=$('#lf');let res=[];
 const run=()=>{const o=f.elements.o.value,m=num(f.elements.m.value);
  const base=db.rej.filter(r=>(r.statut==='Rejeté'||r.statut==='En cours de régularisation')&&rst(r)>0&&(!o||r.org===o));
  res=base.filter(r=>age(r)>=m).sort((a,b)=>age(b)-age(a));
  $('#lk').innerHTML=B.map(([l,a,z])=>{const x=base.filter(r=>age(r)>=a&&age(r)<=z);return`<div><small>${l}</small><b class="${a>90?'ba':a>60?'wa':''}">${x.length} · ${money(x.reduce((s,r)=>s+rst(r),0))} DA</b></div>`}).join('');
  $('#ls').textContent=`${res.length} ordonnance(s) à relancer — ${money(res.reduce((s,r)=>s+rst(r),0))} DA`;
  $('#lt').innerHTML='<tr><th class="r">Ancienneté</th><th>Date</th><th>Org.</th><th>Assuré</th><th>N° assurance</th><th>Bordereau</th><th>Motif</th><th>Statut</th><th class="r">Reste (DA)</th><th class="ac"></th></tr>'+(res.map(r=>{const a=age(r);return`<tr><td class="r ${a>90?'ba':a>60?'wa':''}"><b>${a} j</b></td><td>${fd(r.date)}</td><td>${r.org}</td><td>${esc(r.nom)}</td><td>${esc(r.ass)}</td><td>${esc(r.bnum)}</td><td>${esc(r.motif)}</td><td>${st(r.statut)}</td><td class="r">${money(rst(r))}</td><td class="ac"><button data-e="${r.id}">Ouvrir</button></td></tr>`}).join('')||'<tr><td class="em" colspan="10">Aucun rejet à relancer.</td></tr>')};
 run();f.oninput=f.onchange=run;$('#lp').onclick=prt;
 $('#lt').onclick=e=>{if(e.target.dataset.e){E.rej=e.target.dataset.e;go('rej');scrollTo(0,0)}};
 $('#lx').onclick=()=>out('rejets_a_relancer.csv','\ufeff'+[['Ancienneté (j)','Date','Organisme','Assuré','N° assurance','Bordereau','Motif','Statut','Reste']].concat(res.map(r=>[age(r),fd(r.date),r.org,r.nom,r.ass,r.bnum,r.motif,r.statut,rst(r)])).map(l=>l.map(csvq).join(';')).join('\r\n'))}
function loadX(){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src=window.Capacitor?'xlsx.full.min.js':'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
const iso=v=>{if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=String(v||'').trim();const m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):''};
const tx=v=>String(v==null?'':v).trim(),nm=v=>{v=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function parseWB(wb){const o={dep:[],pay:[],rej:[],rei:[]},rows=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(4):[];
 ORG.forEach(g=>{
  rows('Dépôts '+g).forEach(r=>{const d=iso(r[2]),n=tx(r[5]);if(d&&n)o.dep.push({id:uid(),org:g,date:d,num:n,nb:nm(r[6]),total:nm(r[7]),mfae:nm(r[8]),maj:nm(r[9]),statut:tx(r[11])||'Déposé',obs:tx(r[12])})});
  rows('Paiements '+g).forEach(r=>{const d=iso(r[2]),n=tx(r[5]);if(d&&n)o.pay.push({id:uid(),org:g,date:d,num:n,dnum:tx(r[6]),total:nm(r[8]),mfae:nm(r[9]),maj:nm(r[10]),statut:tx(r[12])||'Reçu',obs:tx(r[13])})})});
 const N=[];
 rows('Rejets ordonnances').forEach(r=>{const d=iso(r[1]),n=tx(r[5]);if(d&&n){const x={id:uid(),org:tx(r[4])||'CNAS',date:d,nom:n,ass:tx(r[6]),bnum:tx(r[7]),montant:nm(r[8]),motif:tx(r[9]),statut:tx(r[10])||'Rejeté',dreg:iso(r[11]),obs:tx(r[14])};o.rej.push(x);N.push([x,nm(r[13]),iso(r[12])])}});
 let nl=0;
 rows('Réintégrations').forEach(r=>{const d=iso(r[1]),a=nm(r[9]);if(!d||!a)return;const nom=nz(r[7]),org=tx(r[4]),c=o.rej.filter(x=>nz(x.nom)===nom&&(!org||x.org===org));
  const x=c.find(y=>tx(r[8])&&y.ass===tx(r[8]))||c.find(y=>y.bnum===tx(r[6]))||c[0];
  if(x)o.rei.push({id:uid(),rid:x.id,date:d,montant:a,just:tx(r[10]),par:tx(r[11]),obs:tx(r[12])});else nl++});
 N.forEach(([x,m,d])=>{const s=o.rei.filter(y=>y.rid===x.id).reduce((t,y)=>t+y.montant,0);if(m-s>0.005)o.rei.push({id:uid(),rid:x.id,date:d||x.dreg||x.date,montant:m-s,just:'Repris du montant réintégré du rejet',par:'',obs:''})});
 o.nl=nl;return o}
function fin(o,add){if(!add){db={dep:o.dep,pay:o.pay,rej:o.rej,rei:o.rei}}else{
  const K={dep:r=>[r.org,r.date,r.num],pay:r=>[r.org,r.date,r.num,r.dnum],rej:r=>[r.org,r.date,nz(r.nom),r.bnum,r.montant]},map={};
  ['dep','pay','rej'].forEach(k=>{const have=new Map(db[k].map(r=>[JSON.stringify(K[k](r)),r.id]));o[k].forEach(r=>{const s=JSON.stringify(K[k](r));if(have.has(s))map[r.id]=have.get(s);else db[k].push(r)})});
  o.rei.forEach(x=>{const rid=map[x.rid]||x.rid;if(!db.rei.some(y=>y.rid===rid&&y.date===x.date&&y.montant===x.montant))db.rei.push(Object.assign(x,{rid}))})}
 db.rej.forEach(r=>{if(reint(r.id)>0)sync(r.id)});save();E={};say('Import terminé.');go(tab)}
$('#ix').onclick=()=>$('#fx').click();
$('#fx').onchange=e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;say('Lecture du classeur…');
 loadX().then(()=>fl.arrayBuffer()).then(b=>{const o=parseWB(XLSX.read(b,{type:'array'}));
  if(o.dep.length+o.pay.length+o.rej.length===0)return say('Aucune donnée trouvée : utilisez le classeur Gestion_Bordereaux (en-têtes en ligne 4).');
  say(`Trouvé : ${o.dep.length} dépôt(s), ${o.pay.length} paiement(s), ${o.rej.length} rejet(s), ${o.rei.length} réintégration(s)`+(o.nl?` — ${o.nl} réintégration(s) ignorée(s) faute de rejet correspondant`:'')+'. Que faire ?',[['Remplacer les données',()=>fin(o,false)],['Ajouter aux données',()=>fin(o,true)]])}).catch(()=>say('Import impossible : bibliothèque Excel indisponible ou fichier illisible.'))};
const NAT=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
async function out(name,data){try{
 if(NAT){const r=await Capacitor.Plugins.Filesystem.writeFile({path:name,data,directory:'CACHE',encoding:'utf8'});await Capacitor.Plugins.Share.share({title:name,url:r.uri,dialogTitle:'Enregistrer ou partager le fichier'});return}
 if(DL)return await DL.save({filename:name,data});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=name;a.click()
 }catch(e){if(!e||(e.code!=='declined'&&!/cancel/i.test(e.message||'')))say('Enregistrement du fichier impossible.')}}
$('#ex').onclick=()=>out('sauvegarde_bordereaux_'+today()+'.json',JSON.stringify(db,null,1));
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!['dep','pay','rej','rei'].every(k=>Array.isArray(o[k])))throw 0;
  say('Remplacer toutes les données actuelles par ce fichier ?',[['Remplacer',()=>{db=o;E={};save();go(tab)}]])}catch(x){say('Fichier invalide.')}};r.readAsText(fl);e.target.value=''};
go('dash');
</script></body></html>
